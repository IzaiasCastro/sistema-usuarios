<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Usuários | CRUD</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <h1>Gerenciamento de Usuários</h1>
    <div class="user-info">
      <span id="usuario-logado-nome">Carregando...</span>
      <button id="btn-logout" class="btn-danger">Sair</button>
    </div>
  </header>

  <main class="container">
    <div id="dash-feedback" class="alert hidden"></div>

    <!-- Formulário de Criação / Edição -->
    <section class="card">
      <h2 id="form-titulo">Novo Usuário</h2>
      <form id="form-user" class="grid-form">
        <input type="hidden" id="user-id">
        <input type="text" id="user-nome" placeholder="Nome completo" required minlength="3">
        <input type="email" id="user-email" placeholder="E-mail" required>
        <select id="user-cargo">
          <option value="Usuário">Usuário</option>
          <option value="Administrador">Administrador</option>
          <option value="Analista">Analista</option>
        </select>
        <input type="password" id="user-senha" placeholder="Senha (obrigatória ao criar)">
        <div class="actions">
          <button type="submit" class="btn-primary" id="btn-salvar">Salvar</button>
          <button type="button" class="btn-secondary hidden" id="btn-cancelar">Cancelar</button>
        </div>
      </form>
    </section>

    <!-- Tabela Dinâmica -->
    <section class="card">
      <h2>Usuários Cadastrados</h2>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>E-mail</th>
            <th>Cargo</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="tabela-usuarios"></tbody>
      </table>
    </section>
  </main>

  <script type="module" src="js/dashboard.js"></script>
</body>
</html>
